# ⚠️ 이 태그를 17로 바꾸고 재시작하지 마세요.
#
# PostgreSQL은 데이터 폴더 형식이 메이저 버전마다 다릅니다. 16이 만든 볼륨에
# 17을 붙이면 컨테이너가 아예 뜨지 않습니다:
#
#   FATAL: database files are incompatible with server
#   DETAIL: The data directory was initialized by PostgreSQL version 16,
#           which is not compatible with this version 17.x
#
# 데이터가 망가지지는 않습니다 — 옛 태그로 되돌리면 다시 뜹니다. 진짜 위험은
# 그 다음입니다. "왜 안 뜨지" 하고 볼륨을 지우면 그때 데이터가 사라집니다.
#
# 17로 가는 길은 덤프 → 새 볼륨 → 복원뿐이고, 절차는
# ../dss-deploy/runbook/01-postgres-통합.md 9절에 있습니다.
# NAS 이식의 2단계에서 이 일을 한 번에 처리합니다.
services:
  db-dev:
    image: postgres:16.14-alpine3.24
    container_name: dss-as-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: dss_app
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD}
      POSTGRES_DB: dss_as_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dss-as-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_app -d dss_as_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-staging:
    image: postgres:16.14-alpine3.24
    container_name: dss-as-postgres-staging
    restart: unless-stopped
    profiles:
      - staging
    environment:
      POSTGRES_USER: dss_app
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD}
      POSTGRES_DB: dss_as_staging
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - dss-as-postgres-staging-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dss_app -d dss_as_staging"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dss-as-postgres-dev-data:
    name: dss-as-postgres-dev-data
  dss-as-postgres-staging-data:
    name: dss-as-postgres-staging-data
